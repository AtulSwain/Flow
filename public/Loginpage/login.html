<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowDesk - Employee Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        blue: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* STRICTLY ENFORCE SQUARE CORNERS EVERYWHERE TO MATCH DASHBOARD */
        * {
            border-radius: 0 !important;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>

<body class="bg-blue-600 font-sans text-slate-800 antialiased min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Main Card -->
    <div id="mainContainer" class="w-full max-w-md bg-white shadow-sm border border-slate-200 p-8 space-y-8 relative">

        <!-- Header -->
        <div class="text-center flex flex-col items-center">
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">FlowDesk</h2>
            <p class="mt-1 text-sm text-slate-500">Sign in to your workspace.</p>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 flex items-start gap-3 text-sm font-medium">
            <i class="fas fa-exclamation-circle mt-0.5 flex-shrink-0"></i>
            <span id="errorText"></span>
        </div>

        <form id="loginForm" class="space-y-5">

            <!-- Role Dropdown -->
            <div class="space-y-2">
                <label for="role" class="block text-sm font-bold text-slate-700">Role</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-users text-slate-400"></i>
                    </div>
                    <select id="role" name="role" required class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 focus:ring-1 focus:ring-blue-600 focus:border-blue-600 sm:text-sm outline-none bg-white appearance-none cursor-pointer transition-colors">
                        <option value="" disabled selected>Select your role</option>
                        <option value="employee">Employee</option>
                        <option value="manager">Manager</option>
                    </select>
                    <!-- Custom Arrow for Select -->
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                        <i class="fas fa-chevron-down text-slate-400 text-xs"></i>
                    </div>
                </div>
            </div>

            <!-- Employee ID -->
            <div class="space-y-2">
                <label for="empId" class="block text-sm font-bold text-slate-700">Employee ID</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-id-badge text-slate-400"></i>
                    </div>
                    <input id="empId" name="empId" type="number" required class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 focus:ring-1 focus:ring-blue-600 focus:border-blue-600 sm:text-sm outline-none transition-colors" placeholder="e.g. 1042">
                </div>
            </div>

            <!-- Email -->
            <div class="space-y-2">
                <label for="email" class="block text-sm font-bold text-slate-700">Work Email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-envelope text-slate-400"></i>
                    </div>
                    <input id="email" name="email" type="email" required class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 focus:ring-1 focus:ring-blue-600 focus:border-blue-600 sm:text-sm outline-none transition-colors" placeholder="name@flowdesk.com">
                </div>
            </div>

            <!-- Password -->
            <div class="space-y-2">
                <label for="password" class="block text-sm font-bold text-slate-700">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-slate-400"></i>
                    </div>
                    <input id="password" name="password" type="password" required class="block w-full pl-10 pr-10 py-2.5 border border-slate-300 focus:ring-1 focus:ring-blue-600 focus:border-blue-600 sm:text-sm outline-none transition-colors" placeholder="Enter your numeric password">
                    <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-blue-600 transition-colors focus:outline-none">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Remember Me -->
            <div class="flex items-center">
                <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-blue-600 border-slate-300 cursor-pointer focus:ring-blue-600 accent-blue-600">
                <label for="remember-me" class="ml-2 block text-sm text-slate-600 cursor-pointer">
                    Remember me on this device
                </label>
            </div>

            <!-- Submit -->
            <button type="submit" id="submitBtn" class="w-full flex justify-center items-center py-3 px-4 border border-blue-700 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none transition-all mt-4">
                <span id="btnText">Sign in to workspace</span>
                <i id="btnLoader" class="fas fa-circle-notch fa-spin hidden ml-2 text-white"></i>
            </button>

            <div class="text-center pt-2">
                <p class="text-sm text-slate-500">
                    Having trouble? <a href="#" class="font-bold text-blue-600 hover:underline">Contact IT Support</a>
                </p>
            </div>

        </form>
    </div>

    <!-- Success Screen -->
    <div id="successScreen" class="hidden w-full max-w-md bg-white border border-slate-200 shadow-sm p-10 flex-col items-center justify-center space-y-6">
        <div class="w-20 h-20 bg-green-50 text-green-600 border border-green-200 flex items-center justify-center mx-auto text-3xl">
            <i class="fas fa-check"></i>
        </div>
        <div class="text-center">
            <h2 class="text-2xl font-bold text-slate-900">Welcome Back!</h2>
            <p class="text-slate-500 mt-2">Redirecting to your dashboard...</p>
        </div>
        <div class="w-full bg-slate-100 h-1">
            <div id="progressBar" class="bg-blue-600 h-full" style="width: 0%; transition: width 1.5s ease-in-out;"></div>
        </div>
    </div>

    <div class="mt-8 text-xs font-bold text-blue-200 uppercase tracking-widest">
        &copy; <span id="currentYear"></span> FlowDesk Inc. Internal use only.
    </div>

    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        const form          = document.getElementById('loginForm');
        const empIdInput    = document.getElementById('empId');
        const emailInput    = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const roleSelect    = document.getElementById('role');
        const toggleBtn     = document.getElementById('togglePassword');
        const toggleIcon    = document.getElementById('toggleIcon');
        const submitBtn     = document.getElementById('submitBtn');
        const btnText       = document.getElementById('btnText');
        const btnLoader     = document.getElementById('btnLoader');
        const errorMessage  = document.getElementById('errorMessage');
        const errorText     = document.getElementById('errorText');
        const mainContainer = document.getElementById('mainContainer');
        const successScreen = document.getElementById('successScreen');
        const progressBar   = document.getElementById('progressBar');

        toggleBtn.addEventListener('click', () => {
            const isPass = passwordInput.type === 'password';
            passwordInput.type = isPass ? 'text' : 'password';
            toggleIcon.className = isPass ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        const showError = (msg) => {
            errorText.textContent = msg;
            errorMessage.classList.remove('hidden');
        };
        
        const hideError = () => errorMessage.classList.add('hidden');

        const setLoading = (on) => {
            btnText.textContent = on ? 'Authenticating...' : 'Sign in to workspace';
            btnLoader.classList.toggle('hidden', !on);
            submitBtn.disabled = on;
            submitBtn.classList.toggle('opacity-70', on);
            submitBtn.classList.toggle('cursor-not-allowed', on);
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const empId    = empIdInput.value.trim();
            const email    = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const role     = roleSelect.value;

            if (!empId || !email || !password || !role) {
                showError('Please fill in all required fields.');
                return;
            }

            setLoading(true);

            try {
                const res  = await fetch('/api/login', {
                    method : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body   : JSON.stringify({
                        id      : parseInt(empId),
                        email,
                        password: parseInt(password),
                        role,
                    }),
                });

                const data = await res.json();

                if (data.success && data.token) {
                    // Store auth info
                    localStorage.setItem('token',    data.token);
                    localStorage.setItem('role',     data.role);
                    localStorage.setItem('userName', data.name || email);

                    // Show success screen
                    mainContainer.classList.add('hidden');
                    successScreen.classList.remove('hidden');
                    successScreen.classList.add('flex');
                    setTimeout(() => { progressBar.style.width = '100%'; }, 100);
                    setTimeout(() => { window.location.href = data.redirect; }, 1800);

                } else {
                    showError(data.message || 'Invalid credentials. Please try again.');
                    setLoading(false);
                }

            } catch (err) {
                showError(err.message || 'Could not reach the login server. Please check your connection and try again.');
                setLoading(false);
            }
        });

        [empIdInput, emailInput, passwordInput, roleSelect].forEach(el => {
            el.addEventListener('input', hideError);
        });
    </script>
</body>
</html>
